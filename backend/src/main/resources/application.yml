spring:
  application:
    name: saudeplus
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/saudeplus}
    username: ${DB_USUARIO:saudeplus}
    password: ${DB_SENHA:saudeplus}
  jpa:
    open-in-view: false
    hibernate:
      # O schema é do Flyway; o Hibernate só confere se as entidades batem.
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  docker:
    compose:
      enabled: false
  jackson:
    time-zone: UTC
  servlet:
    multipart:
      # Resultado de exame: até 10 MB (o service confere de novo).
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

saudeplus:
  fuso-horario: America/Sao_Paulo
  agenda:
    # Horários que começam antes de "agora + antecedência" não são oferecidos.
    antecedencia-minima: 2h
    janela-maxima-dias: 60
    # Paciente cancela ou remarca até este tempo antes da consulta.
    antecedencia-cancelamento: 24h
  front-url: ${FRONT_URL:http://localhost:5173}
  arquivos:
    # Pasta dos resultados de exame. Em produção, aponte para um volume persistente.
    dir: ${ARQUIVOS_DIR:./dados/arquivos}
  jwt:
    # HS256 exige ao menos 32 bytes. Sem valor aqui de propósito: dev e test
    # definem um segredo público abaixo; prod precisa de JWT_SEGREDO.
    segredo: ${JWT_SEGREDO:}
    validade: 8h
  # Contra adivinhação de senha e bombardeio de e-mails: passou do limite, 429.
  limites:
    login-por-conta: { maximo: 5, janela: 15m }
    login-por-ip: { maximo: 30, janela: 15m }
    recuperacao-por-conta: { maximo: 3, janela: 1h }
    recuperacao-por-ip: { maximo: 10, janela: 1h }
  # Prazos de guarda de dados operacionais (LGPD). Prontuário, exames e
  # cobranças não entram aqui: o prontuário se guarda por 20 anos (CFM 1.821/2007).
  retencao:
    cron: "0 30 3 * * *"
    notificacoes-lidas: 180d
    tokens-de-senha: 30d
    # Mínimo de 6 meses (Marco Civil da Internet, art. 15).
    auditoria: 1825d
  redefinicao-senha:
    validade: 30m
    # Link de convite de contas criadas pela administração.
    validade-convite: 72h
  # Seeds: contas iniciais (auth/ContasIniciais) e dados de teste
  # (seed/DadosDeTeste). Desligados por padrão; SEED_ENABLED=true liga.
  seed:
    habilitado: ${SEED_ENABLED:false}
    # Senha de toda conta de teste cuja SEED_*_SENHA não veio. Em branco, as
    # contas principais são puladas e as demais ganham senha aleatória.
    senha-padrao: ${SEED_SENHA_PADRAO:teste@saudeplus}
  # Contas criadas na inicialização se o e-mail ainda não existir; nunca
  # sobrescrevem uma conta existente.
  contas-iniciais:
    admin:
      email: ${SEED_ADMIN_EMAIL:admin@teste.com}
      senha: ${SEED_ADMIN_SENHA:}
      nome: Administrador SaudePlus
    medico:
      email: ${SEED_MEDICO_EMAIL:medico@teste.com}
      senha: ${SEED_MEDICO_SENHA:}
      nome: Dr. Carlos Andrade
      perfil:
        crm: ${SEED_MEDICO_CRM:112.233}
        crm-uf: ${SEED_MEDICO_CRM_UF:RJ}
        especialidade: ${SEED_MEDICO_ESPECIALIDADE:clinico-geral}
        unidade: ${SEED_MEDICO_UNIDADE:}
    # Criado por seed/DadosDeTeste, junto com os demais pacientes de teste.
    paciente:
      email: ${SEED_PACIENTE_EMAIL:paciente@teste.com}
      senha: ${SEED_PACIENTE_SENHA:}

---
spring:
  config:
    activate:
      on-profile: dev
  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start-only
  flyway:
    locations: classpath:db/migration,classpath:db/demo

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

saudeplus:
  jwt:
    segredo: ${JWT_SEGREDO:dev-somente-local-troque-em-producao-0123456789}
  # Localmente o seed já vem ligado: a agenda de demonstração depende do médico inicial.
  seed:
    habilitado: ${SEED_ENABLED:true}
  contas-iniciais:
    medico:
      perfil:
        unidade: ${SEED_MEDICO_UNIDADE:Clínica da Família – Centro}

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration,classpath:db/demo

saudeplus:
  arquivos:
    dir: ${java.io.tmpdir}/saudeplus-testes/arquivos
  # Todos os testes vêm do mesmo IP e dividem o contexto: limites altos aqui.
  # Os limites de verdade são testados em LimiteDeTentativasApiTest.
  limites:
    login-por-conta: { maximo: 10000, janela: 15m }
    login-por-ip: { maximo: 10000, janela: 15m }
    recuperacao-por-conta: { maximo: 10000, janela: 1h }
    recuperacao-por-ip: { maximo: 10000, janela: 1h }
  jwt:
    segredo: ${JWT_SEGREDO:dev-somente-local-troque-em-producao-0123456789}
  # Credenciais fixas: os testes entram com elas, independentemente do ambiente.
  seed:
    habilitado: true
  contas-iniciais:
    admin:
      email: admin@saudeplus.com
      senha: Admin@SaudePlus2026
    medico:
      email: medico@saudeplus.com
      senha: Medico@SaudePlus2026
      perfil:
        crm: 112.233
        crm-uf: RJ
        unidade: Clínica da Família – Centro

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
